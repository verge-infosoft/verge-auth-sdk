[project]
name = "verge-auth-sdk"
version = "0.1.7"
description = "Secure centralized authentication SDK for FastAPI microservices"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "Verge Infosoft", email = "contactus@vergeinfosoft.com" }
]

dependencies = [
    "fastapi",
    "httpx",
    "python-dotenv"
]

[project.urls]
Homepage = "https://www.vergeinfosoft.com"

[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "Cython>=3.0"
]
build-backend = "setuptools.build_meta"

# -------------------------------------------
# PACKAGE DISCOVERY (modern setuptools syntax)
# -------------------------------------------
[tool.setuptools.packages.find]
include = ["verge_auth_sdk"]

# -------------------------------------------
# EXTENSION MODULES (correct modern syntax)
# -------------------------------------------
[tool.setuptools.ext_modules]
middleware = { sources = ["verge_auth_sdk/middleware.py"] }
secret_provider = { sources = ["verge_auth_sdk/secret_provider.py"] }
verge_routes = { sources = ["verge_auth_sdk/verge_routes.py"] }
